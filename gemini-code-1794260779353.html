<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primer Mes • Noches Blancas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0c0e12;
      --bg-surface: rgba(22, 27, 34, 0.75);
      --border-soft: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(200, 210, 225, 0.25);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --silver: #cbd5e1;
      --chimuelo-green: #38ef7d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Atmósfera de niebla y cielo nórdico */
    .sky-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1e2530 0%, #0c0e12 75%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 100px;
    }

    /* Portada / Hero */
    .hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px 10px;
    }

    .tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
      padding: 5px 14px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.1rem, 6vw, 3.2rem);
      letter-spacing: 2px;
      color: #f8fafc;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .sub-hero {
      color: var(--silver);
      font-size: 1.05rem;
      font-weight: 300;
    }

    .dostoievski-quote {
      margin-top: 35px;
      padding: 20px;
      border-left: 2px solid var(--border-glow);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 0 12px 12px 0;
      text-align: left;
      font-style: italic;
      color: var(--silver);
      font-size: 0.95rem;
    }

    .quote-author {
      display: block;
      margin-top: 8px;
      font-style: normal;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .scroll-hint {
      margin-top: 45px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(6px); }
    }

    /* Tarjetas de fotos con efecto Scroll Reveal */
    .timeline-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 80px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(60px);
      transition: all 0
